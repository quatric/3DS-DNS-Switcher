name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build 3DS Binaries
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install makerom and bannertool
        run: |
          set -e
          # Download makerom
          curl -sL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -o /tmp/makerom.zip
          unzip -q -o /tmp/makerom.zip -d /tmp/makerom_dir
          cp /tmp/makerom_dir/makerom /usr/local/bin/
          chmod +x /usr/local/bin/makerom

          # Download bannertool
          curl -sL https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -o /tmp/bannertool.zip
          unzip -q -o /tmp/bannertool.zip -d /tmp/bannertool_dir
          cp /tmp/bannertool_dir/linux-x86_64/bannertool /usr/local/bin/
          chmod +x /usr/local/bin/bannertool

      - name: Compile 3DSX and CIA
        run: |
          make cia

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-DNS-Switcher
          path: |
            standalone/3DS-DNS-Switcher.3dsx
            standalone/3DS-DNS-Switcher.cia

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            standalone/3DS-DNS-Switcher.3dsx
            standalone/3DS-DNS-Switcher.cia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
